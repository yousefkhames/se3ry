<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e9f6e">
<meta name="description" content="Se3ry — supermarket price memory with unit prices and a real-discount detector. Free, offline, Arabic & English. سعري — ذاكرة أسعار السوبرماركت.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Se3ry">
<title>Se3ry — Supermarket price memory</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span id="brandLogo" class="brand-logo">🏷️</span>
    <div>
      <h1 id="brandName">سعري</h1>
      <p id="brandTag" class="brand-tag">ذاكرة أسعار السوبرماركت</p>
    </div>
  </div>
</header>

<main class="container">

  <!-- HOME -->
  <section id="view-home" class="view">
    <h2 data-i18n="home.title">لوحة المتابعة</h2>
    <div class="stats-grid">
      <div class="stat-card"><b id="statProducts">0</b><span data-i18n="home.products">منتجات متتبعة</span></div>
      <div class="stat-card"><b id="statEntries">0</b><span data-i18n="home.entries">أسعار مسجلة</span></div>
      <div class="stat-card"><b id="statStores">0</b><span data-i18n="home.stores">متاجر</span></div>
    </div>
    <div id="homeEmpty" class="card empty-card">
      <p data-i18n="home.empty">لا توجد أسعار بعد.</p>
      <button id="loadSample" class="btn secondary" data-i18n="home.loadSample">تحميل بيانات تجريبية</button>
    </div>
    <div id="homeContent">
      <div class="card">
        <h3 data-i18n="home.bestDeals">الأرخص حاليًا</h3>
        <ul id="homeBest" class="deal-list"></ul>
      </div>
      <div class="card">
        <h3 data-i18n="home.alerts">انتبه</h3>
        <ul id="homeAlerts" class="deal-list"></ul>
      </div>
      <button id="clearAll" class="btn danger-outline" data-i18n="home.clearAll">مسح كل البيانات</button>
    </div>
  </section>

  <!-- ADD -->
  <section id="view-add" class="view" hidden>
    <h2 data-i18n="add.title">تسجيل سعر</h2>
    <div class="card form-card">
      <label><span data-i18n="add.product">المنتج</span>
        <select id="addProduct"></select>
      </label>
      <div id="newProductFields">
        <label><span data-i18n="add.productName">اسم المنتج</span>
          <input id="addName" type="text" autocomplete="off">
        </label>
        <label><span data-i18n="add.brand">الماركة</span>
          <input id="addBrand" type="text" autocomplete="off">
        </label>
        <label><span data-i18n="add.category">الفئة</span>
          <input id="addCategory" type="text" autocomplete="off">
        </label>
      </div>
      <label><span data-i18n="add.store">المتجر</span>
        <input id="addStore" type="text" list="storeList" data-i18n-ph="add.storePlaceholder" autocomplete="off">
        <datalist id="storeList"></datalist>
      </label>
      <div class="row-3">
        <label><span data-i18n="add.price">السعر</span>
          <input id="addPrice" type="number" min="0" step="0.01" inputmode="decimal">
        </label>
        <label><span data-i18n="add.qty">الحجم / الكمية</span>
          <input id="addQty" type="number" min="0" step="any" inputmode="decimal">
        </label>
        <label><span data-i18n="add.unit">الوحدة</span>
          <select id="addUnit">
            <option value="kg">kg</option><option value="g">g</option>
            <option value="l">L</option><option value="ml">ml</option>
            <option value="piece">piece</option><option value="pack">pack</option>
          </select>
        </label>
      </div>
      <p class="unit-price-line"><span data-i18n="add.unitPrice">سعر الوحدة</span>: <b id="addUnitPrice">—</b></p>
      <label><span data-i18n="add.date">التاريخ</span>
        <input id="addDate" type="date">
      </label>
      <label class="check-line">
        <input id="addOnSale" type="checkbox">
        <span data-i18n="add.onSale">معلن كعرض/خصم</span>
      </label>
      <button id="addSave" class="btn primary" data-i18n="add.save">حفظ السعر</button>
    </div>
  </section>

  <!-- PRODUCTS -->
  <section id="view-products" class="view" hidden>
    <h2 data-i18n="products.title">المنتجات</h2>
    <input id="productSearch" class="search" type="search" data-i18n-ph="products.search" placeholder="ابحث…">
    <div id="productList"></div>
  </section>

  <!-- DEAL CHECK -->
  <section id="view-check" class="view" hidden>
    <h2 data-i18n="check.title">كاشف الخصم الحقيقي</h2>
    <p class="muted" data-i18n="check.intro">واقف قدام عرض؟</p>
    <div class="card form-card">
      <label><span data-i18n="add.product">المنتج</span>
        <select id="checkProduct"></select>
      </label>
      <label><span data-i18n="add.store">المتجر</span>
        <input id="checkStore" type="text" list="storeList" data-i18n-ph="add.storePlaceholder" autocomplete="off">
      </label>
      <div class="row-3">
        <label><span data-i18n="add.price">السعر</span>
          <input id="checkPrice" type="number" min="0" step="0.01" inputmode="decimal">
        </label>
        <label><span data-i18n="add.qty">الحجم / الكمية</span>
          <input id="checkQty" type="number" min="0" step="any" inputmode="decimal">
        </label>
        <label><span data-i18n="add.unit">الوحدة</span>
          <select id="checkUnit">
            <option value="kg">kg</option><option value="g">g</option>
            <option value="l">L</option><option value="ml">ml</option>
            <option value="piece">piece</option><option value="pack">pack</option>
          </select>
        </label>
      </div>
      <input id="checkDate" type="date" hidden>
      <button id="checkRun" class="btn primary" data-i18n="check.evaluate">افحص السعر</button>
    </div>
    <div id="checkResult"></div>
    <button id="checkRecord" class="btn secondary" hidden data-i18n="check.record">سجل هذا السعر</button>
  </section>

  <!-- SETTINGS -->
  <section id="view-settings" class="view" hidden>
    <h2 data-i18n="settings.title">الإعدادات</h2>
    <div class="card form-card">
      <h3 data-i18n="settings.branding">الهوية</h3>
      <label><span data-i18n="settings.appName">App name (EN)</span><input id="setAppName" type="text"></label>
      <label><span data-i18n="settings.appNameAr">اسم التطبيق (عربي)</span><input id="setAppNameAr" type="text"></label>
      <label><span data-i18n="settings.tagline">Tagline (EN)</span><input id="setTagline" type="text"></label>
      <label><span data-i18n="settings.taglineAr">الشعار (عربي)</span><input id="setTaglineAr" type="text"></label>
      <label><span data-i18n="settings.logo">الشعار</span><input id="setLogo" type="text" maxlength="8"></label>
      <div class="row-2">
        <label><span data-i18n="settings.primary">اللون الأساسي</span><input id="setPrimary" type="color"></label>
        <label><span data-i18n="settings.accent">اللون المميز</span><input id="setAccent" type="color"></label>
      </div>
      <div class="row-2">
        <label><span data-i18n="settings.currency">العملة</span><input id="setCurrency" type="text" maxlength="6"></label>
        <label><span data-i18n="settings.threshold">حد الصفقة %</span><input id="setThreshold" type="number" min="0" max="90" step="1"></label>
      </div>
      <div class="row-2">
        <label><span data-i18n="settings.language">اللغة</span>
          <select id="setLocale"><option value="ar">العربية</option><option value="en">English</option></select>
        </label>
        <label><span data-i18n="settings.theme">المظهر</span>
          <select id="setTheme"><option value="light">Light</option><option value="dark">Dark</option></select>
        </label>
      </div>
      <div class="btn-row">
        <button id="setSave" class="btn primary" data-i18n="settings.save">حفظ</button>
        <button id="setReset" class="btn secondary" data-i18n="settings.reset">إعادة</button>
      </div>
      <p class="muted small" data-i18n="settings.whiteLabelNote"></p>
      <div class="btn-row">
        <button id="exportBrand" class="btn secondary" data-i18n="settings.exportBrand">تصدير الهوية</button>
        <label class="btn secondary file-btn"><span data-i18n="settings.importBrand">استيراد هوية</span>
          <input id="importBrand" type="file" accept="application/json" hidden></label>
      </div>
    </div>
    <div class="card form-card">
      <h3 data-i18n="settings.data">بياناتك</h3>
      <div class="btn-row">
        <button id="exportData" class="btn secondary" data-i18n="settings.exportData">تصدير JSON</button>
        <button id="exportCSV" class="btn secondary" data-i18n="settings.exportCSV">تصدير CSV</button>
        <label class="btn secondary file-btn"><span data-i18n="settings.importData">استيراد</span>
          <input id="importData" type="file" accept="application/json" hidden></label>
      </div>
    </div>
  </section>

</main>

<nav class="bottomnav">
  <button id="nav-home" class="nav-btn active"><span class="nav-ico">⌂</span><span data-i18n="nav.home">الرئيسية</span></button>
  <button id="nav-add" class="nav-btn"><span class="nav-ico">＋</span><span data-i18n="nav.add">إضافة</span></button>
  <button id="nav-products" class="nav-btn"><span class="nav-ico">☰</span><span data-i18n="nav.products">المنتجات</span></button>
  <button id="nav-check" class="nav-btn"><span class="nav-ico">✓</span><span data-i18n="nav.check">كشف الخصم</span></button>
  <button id="nav-settings" class="nav-btn"><span class="nav-ico">⚙</span><span data-i18n="nav.settings">الإعدادات</span></button>
</nav>

<div id="toast" class="toast" role="status"></div>

<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
